name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: python -m py_compile tool/atomic_sqlite.py tool/extract_osm_pois.py tool/generate_poi_db.py tool/validate_poi_db.py tool/test_atomic_poi_db.py
      - run: python -m unittest tool/test_atomic_poi_db.py
      - name: Validate bundled POI database
        run: |
          python tool/validate_poi_db.py assets/poi_osm.sqlite --min-rows 10000
          python tool/generate_poi_db.py --input tool/sample_pois.json
          test -f build/poi_db/poi_osm.sqlite
          python -c "import sqlite3; c=sqlite3.connect('build/poi_db/poi_osm.sqlite'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'; print('sample db integrity ok')"
      - name: Assert production asset untouched by sample generation
        run: |
          git diff --exit-code -- assets/poi_osm.sqlite
          echo "production asset unchanged"

